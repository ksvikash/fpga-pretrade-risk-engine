name: ApexGate Hardware CI (Verilator & Yosys)

on:
  push:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware_ci.yml'
  pull_request:
    paths:
      - 'hardware/**'

jobs:
  verify-hardware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Hardware Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential verilator yosys make

      - name: Run Verilator Lint
        run: |
          make -C hardware lint

      - name: Run Verilator Simulation Testbench
        run: |
          make -C hardware run

      - name: Run Yosys Synthesis & Resource Report
        run: |
          make -C hardware synth

      - name: Upload Build Artifacts & Reports
        uses: actions/upload-artifact@v4
        with:
          name: hardware-synthesis-reports
          path: |
            hardware/build/synth_report.txt
            hardware/risk_accelerator.vcd
            hardware/alerts.jsonl
